name: SICOES - Scraping Diario

on:
  schedule:
    # Todos los días a las 6am Bolivia (UTC-4 = 10:00 UTC)
    - cron: '0 10 * * *'
  
  workflow_dispatch:
    inputs:
      limite:
        description: 'Número máximo de convocatorias (0 = todas)'
        required: false
        default: '0'
      solo_dbc:
        description: 'Solo DBC (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      
      - name: Run scraper
        run: |
          # Si limite es 0, descargar todas las vigentes
          LIMIT_FLAG=""
          if [ "${{ github.event.inputs.limite || '0' }}" != "0" ]; then
            LIMIT_FLAG="--limit ${{ github.event.inputs.limite }}"
          fi
          
          # Si solo_dbc es true, agregar flag
          DBC_FLAG=""
          if [ "${{ github.event.inputs.solo_dbc || 'false' }}" = "true" ]; then
            DBC_FLAG="--solo-dbc"
          fi
          
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            node descargar.mjs \
            $LIMIT_FLAG \
            $DBC_FLAG \
            --out ./descargas
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add descargas/
          git status
          git diff --staged --quiet || git commit -m "📊 Scraping diario $(date +'%Y-%m-%d')"
          git push

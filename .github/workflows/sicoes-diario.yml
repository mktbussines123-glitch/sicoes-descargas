name: SICOES - Scraping Diario

on:
  schedule:
    # Cada 4 horas: 2am, 6am, 10am, 2pm, 6pm, 10pm (hora Bolivia)
    - cron: '0 6,10,14,18,22,2 * * *'
  
  workflow_dispatch:
    inputs:
      limite:
        description: 'Número máximo de convocatorias (default: 30)'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      
      - name: Run scraper
        run: |
          # Delay aleatorio inicial (0-60 segundos) para parecer humano
          sleep $((RANDOM % 60))
          
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            node descargar.mjs \
            --limit ${{ github.event.inputs.limite || '30' }} \
            --solo-dbc \
            --delay 6000 \
            --out ./descargas
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add descargas/
          git status
          git diff --staged --quiet || git commit -m "📊 Scraping $(date +'%Y-%m-%d %H:%M')"
          git push

name: SICOES - Scraping Diario

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  
  workflow_dispatch:
    inputs:
      limite:
        description: 'Número máximo de convocatorias (default: 20)'
        required: false
        default: '20'

permissions:
  contents: write

env:
  TELEGRAM_TOKEN: '8667911135:AAGZ6z_0Sd2A9fZJHC2fhbMVW64vu5ekX5g'
  TELEGRAM_CHAT_ID: '5705229538'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      
      - name: Run scraper
        id: scraper
        run: |
          sleep $((RANDOM % 120))
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            node descargar.mjs \
            --limit ${{ github.event.inputs.limite || '20' }} \
            --solo-dbc \
            --delay 8000 \
            --out ./descargas
          
          # Contar archivos descargados
          FILES=$(ls -1 descargas/*.docx descargas/*.pdf 2>/dev/null | wc -l)
          echo "files_downloaded=$FILES" >> $GITHUB_OUTPUT
          
          # Verificar errores
          if [ -f descargas/_errores.json ]; then
            ERRORS=$(cat descargas/_errores.json | grep -c "error" || echo "0")
            echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          else
            echo "errors=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Telegram alert - Success
        if: success()
        run: |
          MESSAGE="✅ *SICOES Scraping Completado*

📊 *Archivos descargados:* ${{ steps.scraper.outputs.files_downloaded }}
❌ *Errores:* ${{ steps.scraper.outputs.errors }}
⏰ *Fecha:* $(date +'%Y-%m-%d %H:%M UTC')
🔗 *Ver releases:* https://github.com/${{ github.repository }}/releases"
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"
      
      - name: Send Telegram alert - Failure
        if: failure()
        run: |
          MESSAGE="❌ *SICOES Scraping Falló*

⚠️ *Error en el workflow*
📅 *Fecha:* $(date +'%Y-%m-%d %H:%M UTC')
🔗 *Ver logs:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"
      
      - name: Create Release and upload files
        if: success()
        run: |
          TAG="scraping-$(date +%Y%m%d-%H%M%S)"
          TITLE="📊 Scraping $(date +'%Y-%m-%d %H:%M')"
          
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "Archivos descargados del SICOES - Run #${{ github.run_number }}"
          
          for f in descargas/*.docx descargas/*.pdf descargas/*.txt; do
            if [ -f "$f" ]; then
              echo "Subiendo: $f"
              gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
            fi
          done
          
          gh release upload "$TAG" descargas/_listado.json descargas/_manifest.json --repo "${{ github.repository }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Clean old releases (>7 days)
        run: |
          echo "Limpiando releases antiguas..."
          SEVEN_DAYS_AGO=$(date -d "7 days ago" +%s)
          
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,publishedAt -q '.[] | "\(.tagName) \(.publishedAt)"' | while read TAG DATE; do
            RELEASE_DATE=$(date -d "$DATE" +%s 2>/dev/null || echo "0")
            
            if [ "$RELEASE_DATE" -lt "$SEVEN_DAYS_AGO" ] && [ "$RELEASE_DATE" -gt "0" ]; then
              echo "Eliminando release antigua: $TAG"
              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
            fi
          done
          
          echo "Limpieza completada"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Send Telegram alert - Cleanup
        if: success()
        run: |
          MESSAGE="🧹 *Limpieza Completada*

Releases antiguas eliminadas (>7 días)
📦 *Archivos en release actual:* ${{ steps.scraper.outputs.files_downloaded }}
✅ *Sistema funcionando correctamente*"
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ env.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"
      
      - name: Commit metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p descargas_meta
          cp descargas/_listado.json descargas_meta/ 2>/dev/null || true
          cp descargas/_manifest.json descargas_meta/ 2>/dev/null || true
          git add descargas_meta/
          git diff --staged --quiet || git commit -m "Metadata $(date +'%Y-%m-%d %H:%M')"
          git push

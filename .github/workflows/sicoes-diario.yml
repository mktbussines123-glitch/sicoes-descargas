name: SICOES - Scraping Diario

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  
  workflow_dispatch:
    inputs:
      limite:
        description: 'Número máximo de convocatorias (default: 20)'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      
      - name: Run scraper
        run: |
          sleep $((RANDOM % 120))
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            node descargar.mjs \
            --limit ${{ github.event.inputs.limite || '20' }} \
            --solo-dbc \
            --delay 8000 \
            --out ./descargas
      
      - name: Create Release and upload files
        if: success()
        run: |
          TAG="scraping-$(date +%Y%m%d-%H%M%S)"
          TITLE="📊 Scraping $(date +'%Y-%m-%d %H:%M')"
          
          # Crear release
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "Archivos descargados del SICOES - Run #${{ github.run_number }}"
          
          # Subir archivos uno por uno
          for f in descargas/*.docx descargas/*.pdf descargas/*.txt; do
            if [ -f "$f" ]; then
              echo "Subiendo: $f"
              gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
            fi
          done
          
          # Subir metadata
          gh release upload "$TAG" descargas/_listado.json descargas/_manifest.json --repo "${{ github.repository }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p descargas_meta
          cp descargas/_listado.json descargas_meta/ 2>/dev/null || true
          cp descargas/_manifest.json descargas_meta/ 2>/dev/null || true
          git add descargas_meta/
          git diff --staged --quiet || git commit -m "Metadata $(date +'%Y-%m-%d %H:%M')"
          git push
